# Render Blueprint: one free web service + one free Postgres, wired together.
services:
  - type: web
    name: millproof
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: millproof-db
          property: connectionString
      - key: MCP_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_USER
        value: qa@millproof.demo
      - key: DEMO_PASSWORD
        value: MillProof@2026
      - key: DEMO_NAME
        value: Demo QA Engineer
databases:
  - name: millproof-db
    plan: free
    region: singapore
    databaseName: millproof
